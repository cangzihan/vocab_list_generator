<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>单词表</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<button class="dark-mode-toggle" id="darkToggle" onclick="toggleDark()">
  <div class="toggle-track" id="darkTrack"><div class="toggle-thumb"></div></div>
  <span id="darkIcon">🌙</span>
  <span id="darkLabel">深色</span>
</button>

<div class="unit-picker">
  <label for="unit-select">选择单词表：</label>
  <select id="unit-select"></select>
  </div>
<div class="search-row">
  <div class="search-box">
    <label for="word-search">搜索：</label>
    <input id="word-search" type="search" placeholder="假名 / 汉字 / 释义 / tip" autocomplete="off" />
  </div>
</div>
<h1>单词表</h1>
<!-- 显示模式切换 -->
<div class="display-mode-toggle">
  <button class="mode-btn active" data-mode="all" title="显示全部内容">
    <span>📖</span> 全部
  </button>
  <button class="mode-btn" data-mode="only-gana" title="只显示假名">
    <span>🔤</span> 仅假名
  </button>
  <button class="mode-btn" data-mode="only-explanation" title="只显示释义">
    <span>📝</span> 仅释义
  </button>
  <button class="mode-btn danmaku-btn" id="danmaku-toggle" type="button" title="弹幕模式">
    <span aria-hidden="true">&#9658;</span> 弹幕
  </button>
  <button class="mode-btn" id="cards-toggle" type="button" aria-pressed="false" aria-controls="cards-stage" title="每次显示少量单词卡片">
    <span aria-hidden="true">▤</span> 卡片
  </button>
</div>
<section id="cards-stage" class="cards-stage" aria-label="单词卡片" hidden>
  <div class="cards-toolbar">
    <button id="cards-settings-toggle" type="button" aria-label="卡片设置" title="卡片设置" aria-expanded="false" aria-controls="cards-settings">⚙</button>
    <button id="cards-close" type="button">返回列表</button>
  </div>
  <div id="cards-settings" class="cards-settings" role="region" aria-label="卡片设置" hidden>
    <div class="cards-settings-actions">
      <label for="cards-count">每次显示</label>
      <select id="cards-count">
        <option value="1">1 张</option>
        <option value="2">2 张</option>
        <option value="3" selected>3 张</option>
        <option value="4">4 张</option>
        <option value="5">5 张</option>
        <option value="6">6 张</option>
        <option value="7">7 张</option>
        <option value="8">8 张</option>
        <option value="9">9 张</option>
        <option value="10">10 张</option>
      </select>
      <button id="cards-pause" type="button" aria-pressed="false">暂停自动切换</button>
      <button id="cards-next" type="button">换一组</button>
    </div>
    <div class="cards-dimension-control">
      <label for="cards-width">卡片宽度</label>
      <input id="cards-width" type="range" min="180" max="600" step="10" value="280" />
      <output id="cards-width-value" for="cards-width">280px</output>
    </div>
    <div class="cards-dimension-control">
      <label for="cards-height">卡片高度</label>
      <input id="cards-height" type="range" min="180" max="700" step="10" value="230" />
      <output id="cards-height-value" for="cards-height">230px</output>
    </div>
    <p class="cards-hint">宽高统一应用于所有卡片，窄屏会自动缩减宽度并换行；内容较长时可在卡片内滚动。</p>
    <p class="cards-hint">每 8 秒自动换一组 · 点击查看或收起释义 · 按住卡片拖动调整位置（自动暂停）。20 秒无操作后，所有释义自动收起并继续切换。</p>
    <p id="cards-status" class="cards-status" role="status"></p>
  </div>
  <div id="cards-grid" class="cards-grid"></div>
</section>
<div id="word-table" class="word-table"></div>
<div id="pagination" class="pagination">
  <button id="prev">上一页</button>
  <span id="page-info"></span>
  <button id="next">下一页</button>
  <button id="shuffle">随机打乱本页</button>
  <button id="export">导出当前页PNG</button>
</div>

<div id="danmaku-stage" class="danmaku-stage" hidden>
  <div id="danmaku-track" class="danmaku-track"></div>
  <div class="danmaku-size-control">
    <label for="danmaku-size">大小</label>
    <input id="danmaku-size" type="range" min="70" max="180" step="5" value="100" />
    <span id="danmaku-size-value">100%</span>
  </div>
  <button id="danmaku-close" class="danmaku-close" type="button" aria-label="关闭弹幕模式">&times;</button>
  <div id="danmaku-info" class="danmaku-info" hidden></div>
</div>


  <!-- 单词数据 -->
  <script src="vocab.js"></script>
<script src="adverb.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<!-- 渲染逻辑 -->
<script>
  const container = document.getElementById("word-table");
  const pageInfo = document.getElementById("page-info");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const unitSelect = document.getElementById("unit-select");
  const wordSearch = document.getElementById("word-search");
  const titleEl = document.querySelector('h1');
  const danmakuToggle = document.getElementById("danmaku-toggle");
  const danmakuStage = document.getElementById("danmaku-stage");
  const danmakuTrack = document.getElementById("danmaku-track");
  const danmakuClose = document.getElementById("danmaku-close");
  const danmakuInfo = document.getElementById("danmaku-info");
  const danmakuSize = document.getElementById("danmaku-size");
  const danmakuSizeValue = document.getElementById("danmaku-size-value");
  const cardsToggle = document.getElementById("cards-toggle");
  const cardsStage = document.getElementById("cards-stage");
  const cardsGrid = document.getElementById("cards-grid");
  const cardsCount = document.getElementById("cards-count");
  const cardsPause = document.getElementById("cards-pause");
  const cardsNext = document.getElementById("cards-next");
  const cardsClose = document.getElementById("cards-close");
  const cardsStatus = document.getElementById("cards-status");
  const cardsSettingsToggle = document.getElementById("cards-settings-toggle");
  const cardsSettings = document.getElementById("cards-settings");
  const cardsWidth = document.getElementById("cards-width");
  const cardsHeight = document.getElementById("cards-height");
  const cardsWidthValue = document.getElementById("cards-width-value");
  const cardsHeightValue = document.getElementById("cards-height-value");

  const pageSize = 19;     // ✅ 每页显示多少个
  let currentPage = 1;

  let shuffledPageData = null;
  let danmakuActive = false;
  let danmakuTimers = [];
  let danmakuScale = Number(localStorage.getItem('danmakuScale')) || 100;
  let cardsActive = false;
  let cardsPaused = false;
  let cardsTimer = null;
  let cardsIdleTimer = null;
  let cardsDeck = [];
  let cardsCursor = 0;
  let cardsPositions = [];

  // 支持弹幕释义框拖动
  let dragging = false;
  let dragOffsetX = 0;
  let dragOffsetY = 0;

  danmakuInfo.addEventListener('mousedown', e => {
    dragging = true;

    const rect = danmakuInfo.getBoundingClientRect();

    dragOffsetX = e.clientX - rect.left;
    dragOffsetY = e.clientY - rect.top;

    // 取消原来的居中布局
    danmakuInfo.style.left = `${rect.left}px`;
    danmakuInfo.style.top = `${rect.top}px`;
    danmakuInfo.style.bottom = 'auto';
    danmakuInfo.style.transform = 'none';

    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;

    danmakuInfo.style.left =
        `${e.clientX - dragOffsetX}px`;

    danmakuInfo.style.top =
        `${e.clientY - dragOffsetY}px`;
  });

  document.addEventListener('mouseup', () => {
    dragging = false;
  });

  // ============ Dark 模式 ============
  function toggleDark() {
    const isDark = document.body.classList.toggle('dark-mode');
    document.getElementById('darkTrack').classList.toggle('on', isDark);
    document.getElementById('darkIcon').textContent = isDark ? '☀️' : '🌙';
    document.getElementById('darkLabel').textContent = isDark ? '浅色' : '深色';
    localStorage.setItem('darkMode', isDark ? '1' : '0');
  }

  // 初始化（读取上次的选择）
  if (localStorage.getItem('darkMode') === '1') toggleDark();

  function getAllUnits() {
    const list = window.vocab || [];
    const units = Array.from(new Set(list.map(i => i.unit || "默认")));
    return units;
  }

  function populateUnitSelect() {
    const units = getAllUnits();
    unitSelect.innerHTML = "";
    const allOpt = document.createElement('option');
    allOpt.value = 'ALL';
    allOpt.textContent = '全部';
    unitSelect.appendChild(allOpt);
    units.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u;
      opt.textContent = u;
      unitSelect.appendChild(opt);
    });
  }

  function updateTitle() {
    const selected = unitSelect.value || 'ALL';
    if (selected === 'ALL') {
      titleEl.textContent = '所有单词表';
    } else {
      titleEl.textContent = selected;
    }
    return;
    const query = (wordSearch.value || '').trim().toLowerCase();
    const unitFiltered = selected === 'ALL'
      ? list
      : list.filter(i => (i.unit || '默认') === selected);

    if (!query) return unitFiltered;

    return unitFiltered.filter(word => {
      return [
        word.gana,
        word.kanji,
        word.explanation,
        word.tip,
        word.unit
      ].some(value => String(value || '').toLowerCase().includes(query));
    });
    if (selected === 'ALL') {
      titleEl.textContent = '所有单词表';
    } else {
      titleEl.textContent = selected;
    }
  }

  function getFilteredData() {
    const list = window.vocab || [];
    const selected = unitSelect.value || 'ALL';
    const query = (wordSearch.value || '').trim().toLowerCase();
    const unitFiltered = selected === 'ALL'
      ? list
      : list.filter(i => (i.unit || '默认') === selected);

    if (!query) return unitFiltered;

    return unitFiltered.filter(word => {
      return [
        word.gana,
        word.kanji,
        word.explanation,
        word.tip,
        word.unit
      ].some(value => String(value || '').toLowerCase().includes(query));
    });
    if (selected === 'ALL') return list;
    return list.filter(i => (i.unit || '默认') === selected);
  }

  function updateTitle() {
    const selected = unitSelect.value || 'ALL';
    titleEl.textContent = selected === 'ALL' ? '所有单词表' : selected;
  }

  function getFilteredData() {
    const list = window.vocab || [];
    const selected = unitSelect.value || 'ALL';
    const query = (wordSearch.value || '').trim().toLowerCase();
    const unitFiltered = selected === 'ALL'
      ? list
      : list.filter(word => (word.unit || '默认') === selected);

    if (!query) return unitFiltered;

    return unitFiltered.filter(word => {
      return [
        word.gana,
        word.kanji,
        word.explanation,
        word.tip,
        word.unit
      ].some(value => String(value || '').toLowerCase().includes(query));
    });
  }

  function shuffleArray(array) {
    const arr = [...array]; // 不修改原数组
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function randomBetween(min, max) {
    return Math.random() * (max - min) + min;
  }

  function applyDanmakuScale(value) {
    danmakuScale = Math.min(180, Math.max(70, Number(value) || 100));
    danmakuSize.value = String(danmakuScale);
    danmakuSizeValue.textContent = `${danmakuScale}%`;
    danmakuStage.style.setProperty('--danmaku-scale', danmakuScale / 100);
    localStorage.setItem('danmakuScale', String(danmakuScale));
  }

  function getDanmakuWords() {
    return getFilteredData().filter(word => {
      return (word.gana || word.kanji || word.explanation || '').toString().trim();
    });
  }

  function getDanmakuLabel(word) {
    const gana = (word.gana || '').trim();
    const kanji = (word.kanji || '').trim();
    const fallback = (word.explanation || '').trim();

    if (kanji) {
      return `
        <ruby>
          <span class="danmaku-kanji">${escapeHtml(kanji)}</span>
          ${gana ? `<rt>${escapeHtml(gana)}</rt>` : ''}
        </ruby>
      `;
    }

    return escapeHtml(gana || fallback);
  }

  function showDanmakuInfo(word) {
    const explanation = (word.explanation || '').trim() || '暂无释义';
    danmakuInfo.innerHTML = `
      <div class="danmaku-info-word">${getDanmakuLabel(word)}</div>
      <div class="danmaku-info-explanation">${escapeHtml(explanation)}</div>
    `;
    danmakuInfo.hidden = false;
  }

  function clearDanmakuTimers() {
    danmakuTimers.forEach(timer => clearTimeout(timer));
    danmakuTimers = [];
  }

  function scheduleDanmakuWord(word, delay) {
    const timer = setTimeout(() => {
      if (!danmakuActive) return;
      createDanmakuWord(word);
    }, delay);
    danmakuTimers.push(timer);
  }

  function createDanmakuWord(word) {
    const item = document.createElement('button');
    item.type = 'button';
    item.className = 'danmaku-word';
    item.innerHTML = getDanmakuLabel(word);
    item.style.top = `${randomBetween(8, 82)}vh`;
    item.style.animationDuration = `${randomBetween(9, 22)}s`;
    item.style.setProperty('--danmaku-base-size', `${randomBetween(1.15, 2.1)}rem`);

    item.addEventListener('click', () => showDanmakuInfo(word));
    item.addEventListener('animationend', () => {
      item.remove();
      if (!danmakuActive) return;
      const words = getDanmakuWords();
      const nextWord = words[Math.floor(Math.random() * words.length)];
      if (nextWord) {
        scheduleDanmakuWord(nextWord, randomBetween(300, 2800));
      }
    });

    danmakuTrack.appendChild(item);
  }

  function startDanmakuLoop() {
    clearDanmakuTimers();
    danmakuTrack.innerHTML = '';
    danmakuInfo.hidden = true;

    const words = shuffleArray(getDanmakuWords());
    if (!words.length) {
      danmakuInfo.innerHTML = '<div class="danmaku-info-explanation">当前单词表没有可显示的内容</div>';
      danmakuInfo.hidden = false;
      return;
    }

    words.forEach((word, index) => {
      scheduleDanmakuWord(word, index * 420 + randomBetween(0, 2200));
    });
  }

  function enterDanmakuMode() {
    if (cardsActive) leaveCardsMode();
    danmakuActive = true;
    danmakuStage.hidden = false;
    document.body.classList.add('danmaku-mode');
    danmakuToggle.classList.add('active');
    danmakuToggle.setAttribute('aria-pressed', 'true');
    startDanmakuLoop();
  }

  function leaveDanmakuMode() {
    danmakuActive = false;
    clearDanmakuTimers();
    danmakuTrack.innerHTML = '';
    danmakuInfo.hidden = true;
    danmakuStage.hidden = true;
    document.body.classList.remove('danmaku-mode');
    danmakuToggle.classList.remove('active');
    danmakuToggle.setAttribute('aria-pressed', 'false');
  }

  // ============ 少量卡片循环显示 ============
  function setCardsSettingsOpen(open) {
    cardsSettings.hidden = !open;
    cardsSettingsToggle.setAttribute('aria-expanded', String(open));
  }

  function applyCardsDimensions(width, height) {
    const cardWidth = Math.min(600, Math.max(180, Number(width) || 280));
    const cardHeight = Math.min(700, Math.max(180, Number(height) || 230));
    cardsWidth.value = String(cardWidth);
    cardsHeight.value = String(cardHeight);
    cardsWidthValue.textContent = `${cardWidth}px`;
    cardsHeightValue.textContent = `${cardHeight}px`;
    cardsStage.style.setProperty('--card-width', `${cardWidth}px`);
    cardsStage.style.setProperty('--card-height', `${cardHeight}px`);
    localStorage.setItem('cardsWidth', String(cardWidth));
    localStorage.setItem('cardsHeight', String(cardHeight));
  }

  function scheduleCardsBatch() {
    clearTimeout(cardsTimer);
    cardsTimer = null;
    if (cardsActive && !cardsPaused && cardsDeck.length > Number(cardsCount.value)) {
      cardsTimer = setTimeout(showNextCardsBatch, 8000);
    }
  }

  function setCardsPaused(paused) {
    cardsPaused = paused;
    cardsPause.textContent = paused ? '继续自动切换' : '暂停自动切换';
    cardsPause.setAttribute('aria-pressed', String(paused));
    scheduleCardsBatch();
    resetCardsIdleTimer();
  }

  function resetCardsIdleTimer() {
    clearTimeout(cardsIdleTimer);
    cardsIdleTimer = null;
    if (!cardsActive || !cardsPaused) return;
    cardsIdleTimer = setTimeout(() => {
      cardsIdleTimer = null;
      if (!cardsActive || !cardsPaused) return;
      // 按住卡片拖动期间不刷新，松开后重新计算闲置时间。
      if (cardsGrid.querySelector('.dragging')) {
        resetCardsIdleTimer();
        return;
      }
      cardsGrid.querySelectorAll('.word-card').forEach(card => {
        card.querySelector('.word-card-details').hidden = true;
        card.setAttribute('aria-expanded', 'false');
        card.scrollTop = 0;
      });
      setCardsPaused(false);
    }, 20000);
  }

  function enableCardDragging(card, index) {
    const position = cardsPositions[index] || { x: 0, y: 0 };
    cardsPositions[index] = position;
    const applyPosition = () => {
      card.style.setProperty('--card-x', `${position.x}px`);
      card.style.setProperty('--card-y', `${position.y}px`);
    };
    applyPosition();
    let drag = null;
    let suppressClick = false;

    card.addEventListener('pointerdown', event => {
      if (event.button !== 0 || !event.isPrimary) return;
      suppressClick = false;
      drag = {
        pointerId: event.pointerId,
        startX: event.clientX,
        startY: event.clientY,
        x: position.x,
        y: position.y,
        rect: card.getBoundingClientRect(),
        moved: false
      };
      card.setPointerCapture(event.pointerId);
    });

    card.addEventListener('pointermove', event => {
      if (!drag || event.pointerId !== drag.pointerId) return;
      const dx = event.clientX - drag.startX;
      const dy = event.clientY - drag.startY;
      if (!drag.moved && Math.hypot(dx, dy) < 5) return;
      if (!drag.moved) {
        drag.moved = true;
        setCardsPaused(true);
        card.classList.add('dragging');
      }
      // 保持卡片可见，并留出上方操作按钮的位置。
      const topEdge = Math.max(12, cardsStage.querySelector('.cards-toolbar').getBoundingClientRect().bottom + 12);
      const maxLeft = Math.max(12, window.innerWidth - drag.rect.width - 12);
      const maxTop = Math.max(topEdge, window.innerHeight - drag.rect.height - 12);
      const left = Math.min(maxLeft, Math.max(12, drag.rect.left + dx));
      const top = Math.min(maxTop, Math.max(topEdge, drag.rect.top + dy));
      position.x = drag.x + left - drag.rect.left;
      position.y = drag.y + top - drag.rect.top;
      applyPosition();
      resetCardsIdleTimer();
      event.preventDefault();
    });

    const finishDrag = event => {
      if (!drag || event.pointerId !== drag.pointerId) return;
      suppressClick = drag.moved;
      drag = null;
      card.classList.remove('dragging');
      if (card.hasPointerCapture(event.pointerId)) card.releasePointerCapture(event.pointerId);
    };
    card.addEventListener('pointerup', finishDrag);
    card.addEventListener('pointercancel', finishDrag);
    card.addEventListener('lostpointercapture', finishDrag);
    card.addEventListener('click', event => {
      if (suppressClick && event.detail !== 0) {
        event.stopImmediatePropagation();
        event.preventDefault();
      }
      suppressClick = false;
    });
  }

  function showNextCardsBatch() {
    if (!cardsActive) return;
    cardsGrid.innerHTML = '';
    if (!cardsDeck.length) {
      cardsStatus.textContent = '当前筛选范围没有可显示的单词';
      cardsNext.disabled = true;
      cardsPause.disabled = true;
      scheduleCardsBatch();
      return;
    }

    if (cardsCursor >= cardsDeck.length) {
      cardsDeck = shuffleArray(cardsDeck);
      cardsCursor = 0;
    }
    const start = cardsCursor;
    const batch = cardsDeck.slice(start, start + Number(cardsCount.value));
    cardsCursor += batch.length;
    cardsStatus.textContent = `本轮第 ${start + 1}–${cardsCursor} 个 / 共 ${cardsDeck.length} 个单词`;
    cardsNext.disabled = false;
    cardsPause.disabled = cardsDeck.length <= Number(cardsCount.value);

    batch.forEach((word, index) => {
      const card = document.createElement('button');
      card.type = 'button';
      card.className = 'word-card';
      card.setAttribute('aria-expanded', 'false');
      const example = typeof word.example === 'string' ? word.example.trim() : '';
      const tip = typeof word.tip === 'string' ? word.tip.trim() : '';
      card.innerHTML = `
        <span class="word-card-label">${getDanmakuLabel(word)}</span>
        <span class="word-card-details" hidden>
          <span class="word-card-explanation">${escapeHtml(word.explanation || '暂无释义')}</span>
          ${example ? `<span class="word-card-note"><strong>例句</strong>${escapeHtml(example)}</span>` : ''}
          ${tip ? `<span class="word-card-note"><strong>Tip</strong>${escapeHtml(tip)}</span>` : ''}
        </span>
      `;
      enableCardDragging(card, index);
      card.addEventListener('click', () => {
        const details = card.querySelector('.word-card-details');
        const expanded = details.hidden;
        details.hidden = !expanded;
        card.setAttribute('aria-expanded', String(expanded));
        if (expanded) setCardsPaused(true);
      });
      cardsGrid.appendChild(card);
    });
    scheduleCardsBatch();
  }

  function restartCardsLoop() {
    cardsDeck = shuffleArray(getDanmakuWords());
    cardsCursor = 0;
    showNextCardsBatch();
  }

  function enterCardsMode() {
    if (danmakuActive) leaveDanmakuMode();
    cardsActive = true;
    cardsStage.hidden = false;
    setCardsSettingsOpen(false);
    document.body.classList.add('cards-mode');
    cardsToggle.classList.add('active');
    cardsToggle.setAttribute('aria-pressed', 'true');
    setCardsPaused(false);
    restartCardsLoop();
  }

  function leaveCardsMode() {
    cardsActive = false;
    clearTimeout(cardsTimer);
    cardsTimer = null;
    clearTimeout(cardsIdleTimer);
    cardsIdleTimer = null;
    cardsGrid.innerHTML = '';
    cardsStage.hidden = true;
    setCardsSettingsOpen(false);
    document.body.classList.remove('cards-mode');
    cardsToggle.classList.remove('active');
    cardsToggle.setAttribute('aria-pressed', 'false');
  }

  function renderPage(page) {
    container.innerHTML = "";

    const data = getFilteredData();
    const start = (page - 1) * pageSize;
    const end = start + pageSize;
    let pageData = data.slice(start, end);

    if (shuffledPageData) {
      pageData = shuffledPageData;
    }
    const exportBtn = document.getElementById("export");

    exportBtn.onclick = async () => {
      const table = document.getElementById("word-table");
      
      // 🛑 截图前：添加冻结类
      document.body.classList.add('disable-animation');
      
      // 确保重绘生效
      await new Promise(resolve => requestAnimationFrame(resolve));
      
      // 等待字体就绪
      if (document.fonts?.ready) await document.fonts.ready;

      try {
        const canvas = await html2canvas(table, {
          scale: 3,
          backgroundColor: "#ffffff",
          useCORS: true,
          logging: false
        });
        
        // 下载逻辑...
        const link = document.createElement("a");
        link.download = `wordlist_${unitSelect.value}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
        
      } finally {
        // 截图后：无论成功失败，务必移除冻结类
        document.body.classList.remove('disable-animation');
      }
    };

    pageData.forEach(word => {
      const row = document.createElement("div");
      row.className = "word-row";
      const tip = typeof word.tip === 'string' ? word.tip.trim() : '';
      const example = typeof word.example === 'string' ? word.example.trim() : '';

      row.innerHTML = `
        <div class="cell gana">${escapeHtml(word.gana || "")}</div>
        <div class="cell kanji">${escapeHtml(word.kanji || "")}</div>
        <div class="cell explanation">
          <div class="explanation-text">${escapeHtml(word.explanation || "")}</div>
          ${example ? `
            <button class="example-toggle" type="button" aria-expanded="false">exp</button>
            <div class="example-panel" hidden>${escapeHtml(example)}</div>
          ` : ''}
          ${tip ? `
            <button class="tip-toggle" type="button" aria-expanded="false">Tip</button>
            <div class="tip-panel" hidden>${escapeHtml(tip)}</div>
          ` : ''}
        </div>
      `;

      const exampleButton = row.querySelector('.example-toggle');
      if (exampleButton) {
        exampleButton.addEventListener('click', () => {
          const panel = row.querySelector('.example-panel');
          const isOpen = !panel.hidden;
          panel.hidden = isOpen;
          exampleButton.setAttribute('aria-expanded', String(!isOpen));
          exampleButton.classList.toggle('active', !isOpen);
        });
      }

      const tipButton = row.querySelector('.tip-toggle');
      if (tipButton) {
        tipButton.addEventListener('click', () => {
          const panel = row.querySelector('.tip-panel');
          const isOpen = !panel.hidden;
          panel.hidden = isOpen;
          tipButton.setAttribute('aria-expanded', String(!isOpen));
          tipButton.classList.toggle('active', !isOpen);
        });
      }

      container.appendChild(row);
    });

    const totalPages = Math.max(1, Math.ceil(data.length / pageSize));
    pageInfo.textContent = `第 ${page} / ${totalPages} 页`;

    prevBtn.disabled = page === 1;
    nextBtn.disabled = page === totalPages;
  }

  prevBtn.onclick = () => {
    if (currentPage > 1) {
      shuffledPageData = null;
      currentPage--;
      renderPage(currentPage);
    }
  };

  nextBtn.onclick = () => {
    const totalPages = Math.ceil(getFilteredData().length / pageSize) || 1;
    if (currentPage < totalPages) {
      shuffledPageData = null;
      currentPage++;
      renderPage(currentPage);
    }
  };

  const shuffleBtn = document.getElementById("shuffle");

  shuffleBtn.onclick = () => {
    const data = getFilteredData();
    const start = (currentPage - 1) * pageSize;
    const end = start + pageSize;

    const currentPageData = data.slice(start, end);

    shuffledPageData = shuffleArray(currentPageData);

    renderPage(currentPage);
  };

  unitSelect.onchange = () => {
    shuffledPageData = null;
    currentPage = 1;
    updateTitle();
    renderPage(currentPage);
    if (danmakuActive) {
      startDanmakuLoop();
    }
    if (cardsActive) restartCardsLoop();
  };

  // ============ 显示模式切换功能 ============
  // 显示模式切换功能
  wordSearch.addEventListener('input', () => {
    shuffledPageData = null;
    currentPage = 1;
    renderPage(currentPage);
    if (danmakuActive) {
      startDanmakuLoop();
    }
    if (cardsActive) restartCardsLoop();
  });

const modeButtons = document.querySelectorAll('.mode-btn[data-mode]');
let currentDisplayMode = 'all';

function setDisplayMode(mode) {
  currentDisplayMode = mode;
  
  modeButtons.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  
  container.classList.remove('mode-only-gana', 'mode-only-explanation');
  if (mode === 'only-gana') {
    container.classList.add('mode-only-gana');
  } else if (mode === 'only-explanation') {
    container.classList.add('mode-only-explanation');
  }
  
  localStorage.setItem('wordTableDisplayMode', mode);
}

modeButtons.forEach(btn => {
  btn.addEventListener('click', () => {
    if (cardsActive) leaveCardsMode();
    setDisplayMode(btn.dataset.mode);
  });
});

cardsToggle.addEventListener('click', () => {
  if (cardsActive) leaveCardsMode();
  else enterCardsMode();
});
cardsClose.addEventListener('click', () => {
  leaveCardsMode();
  cardsToggle.focus();
});
cardsPause.addEventListener('click', () => setCardsPaused(!cardsPaused));
['pointerdown', 'pointerup', 'pointercancel', 'click', 'keydown', 'input', 'change', 'wheel'].forEach(type => {
  cardsStage.addEventListener(type, resetCardsIdleTimer, { passive: true });
});
cardsSettingsToggle.addEventListener('click', () => setCardsSettingsOpen(cardsSettings.hidden));
[cardsWidth, cardsHeight].forEach(input => {
  input.addEventListener('input', () => {
    setCardsPaused(true);
    applyCardsDimensions(cardsWidth.value, cardsHeight.value);
  });
});
cardsNext.addEventListener('click', showNextCardsBatch);
cardsCount.addEventListener('change', () => {
  cardsPositions = [];
  restartCardsLoop();
});

danmakuToggle.addEventListener('click', () => {
  if (danmakuActive) {
    leaveDanmakuMode();
  } else {
    enterDanmakuMode();
  }
});

danmakuClose.addEventListener('click', leaveDanmakuMode);

danmakuSize.addEventListener('input', () => {
  applyDanmakuScale(danmakuSize.value);
});

document.addEventListener('keydown', event => {
  if (event.key === 'Escape' && danmakuActive) {
    leaveDanmakuMode();
  }
  if (event.key === 'Escape' && cardsActive) {
    leaveCardsMode();
    cardsToggle.focus();
  }
});

// 初始化
const savedMode = localStorage.getItem('wordTableDisplayMode') || 'all';
setDisplayMode(savedMode);
applyDanmakuScale(danmakuScale);
applyCardsDimensions(localStorage.getItem('cardsWidth'), localStorage.getItem('cardsHeight'));

  // 初始化选择并渲染
  populateUnitSelect();
  updateTitle();
  renderPage(currentPage);
</script>

</body>
</html>
