<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>单词表</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<button class="dark-mode-toggle" id="darkToggle" onclick="toggleDark()">
  <div class="toggle-track" id="darkTrack"><div class="toggle-thumb"></div></div>
  <span id="darkIcon">🌙</span>
  <span id="darkLabel">深色</span>
</button>

<div>
  <label for="unit-select">选择单词表：</label>
  <select id="unit-select"></select>
</div>
<h1>单词表</h1>
<!-- 显示模式切换 -->
<div class="display-mode-toggle">
  <button class="mode-btn active" data-mode="all" title="显示全部内容">
    <span>📖</span> 全部
  </button>
  <button class="mode-btn" data-mode="only-gana" title="只显示假名">
    <span>🔤</span> 仅假名
  </button>
  <button class="mode-btn" data-mode="only-explanation" title="只显示释义">
    <span>📝</span> 仅释义
  </button>
</div>
<div id="word-table" class="word-table"></div>
<div id="pagination" class="pagination">
  <button id="prev">上一页</button>
  <span id="page-info"></span>
  <button id="next">下一页</button>
  <button id="shuffle">随机打乱本页</button>
  <button id="export">导出当前页PNG</button>
</div>


  <!-- 单词数据 -->
  <script src="vocab.js"></script>
<script src="adverb.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
<!-- 渲染逻辑 -->
<script>
  const container = document.getElementById("word-table");
  const pageInfo = document.getElementById("page-info");
  const prevBtn = document.getElementById("prev");
  const nextBtn = document.getElementById("next");
  const unitSelect = document.getElementById("unit-select");
  const titleEl = document.querySelector('h1');

  const pageSize = 19;     // ✅ 每页显示多少个
  let currentPage = 1;

  let shuffledPageData = null;

  // ============ Dark 模式 ============
  function toggleDark() {
    const isDark = document.body.classList.toggle('dark-mode');
    document.getElementById('darkTrack').classList.toggle('on', isDark);
    document.getElementById('darkIcon').textContent = isDark ? '☀️' : '🌙';
    document.getElementById('darkLabel').textContent = isDark ? '浅色' : '深色';
    localStorage.setItem('darkMode', isDark ? '1' : '0');
  }

  // 初始化（读取上次的选择）
  if (localStorage.getItem('darkMode') === '1') toggleDark();

  function getAllUnits() {
    const list = window.vocab || [];
    const units = Array.from(new Set(list.map(i => i.unit || "默认")));
    return units;
  }

  function populateUnitSelect() {
    const units = getAllUnits();
    unitSelect.innerHTML = "";
    const allOpt = document.createElement('option');
    allOpt.value = 'ALL';
    allOpt.textContent = '全部';
    unitSelect.appendChild(allOpt);
    units.forEach(u => {
      const opt = document.createElement('option');
      opt.value = u;
      opt.textContent = u;
      unitSelect.appendChild(opt);
    });
  }

  function updateTitle() {
    const selected = unitSelect.value || 'ALL';
    if (selected === 'ALL') {
      titleEl.textContent = '所有单词表';
    } else {
      titleEl.textContent = selected;
    }
  }

  function getFilteredData() {
    const list = window.vocab || [];
    const selected = unitSelect.value || 'ALL';
    if (selected === 'ALL') return list;
    return list.filter(i => (i.unit || '默认') === selected);
  }

  function shuffleArray(array) {
    const arr = [...array]; // 不修改原数组
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#39;");
  }

  function renderPage(page) {
    container.innerHTML = "";

    const data = getFilteredData();
    const start = (page - 1) * pageSize;
    const end = start + pageSize;
    let pageData = data.slice(start, end);

    if (shuffledPageData) {
      pageData = shuffledPageData;
    }
    const exportBtn = document.getElementById("export");

    exportBtn.onclick = async () => {
      const table = document.getElementById("word-table");
      
      // 🛑 截图前：添加冻结类
      document.body.classList.add('disable-animation');
      
      // 确保重绘生效
      await new Promise(resolve => requestAnimationFrame(resolve));
      
      // 等待字体就绪
      if (document.fonts?.ready) await document.fonts.ready;

      try {
        const canvas = await html2canvas(table, {
          scale: 3,
          backgroundColor: "#ffffff",
          useCORS: true,
          logging: false
        });
        
        // 下载逻辑...
        const link = document.createElement("a");
        link.download = `wordlist_${unitSelect.value}.png`;
        link.href = canvas.toDataURL("image/png");
        link.click();
        
      } finally {
        // 截图后：无论成功失败，务必移除冻结类
        document.body.classList.remove('disable-animation');
      }
    };

    pageData.forEach(word => {
      const row = document.createElement("div");
      row.className = "word-row";
      const tip = typeof word.tip === 'string' ? word.tip.trim() : '';

      row.innerHTML = `
        <div class="cell gana">${escapeHtml(word.gana || "")}</div>
        <div class="cell kanji">${escapeHtml(word.kanji || "")}</div>
        <div class="cell explanation">
          <div class="explanation-text">${escapeHtml(word.explanation || "")}</div>
          ${tip ? `
            <button class="tip-toggle" type="button" aria-expanded="false">Tip</button>
            <div class="tip-panel" hidden>${escapeHtml(tip)}</div>
          ` : ''}
        </div>
      `;

      const tipButton = row.querySelector('.tip-toggle');
      if (tipButton) {
        tipButton.addEventListener('click', () => {
          const panel = row.querySelector('.tip-panel');
          const isOpen = !panel.hidden;
          panel.hidden = isOpen;
          tipButton.setAttribute('aria-expanded', String(!isOpen));
          tipButton.classList.toggle('active', !isOpen);
        });
      }

      container.appendChild(row);
    });

    const totalPages = Math.max(1, Math.ceil(data.length / pageSize));
    pageInfo.textContent = `第 ${page} / ${totalPages} 页`;

    prevBtn.disabled = page === 1;
    nextBtn.disabled = page === totalPages;
  }

  prevBtn.onclick = () => {
    if (currentPage > 1) {
      shuffledPageData = null;
      currentPage--;
      renderPage(currentPage);
    }
  };

  nextBtn.onclick = () => {
    const totalPages = Math.ceil(getFilteredData().length / pageSize) || 1;
    if (currentPage < totalPages) {
      shuffledPageData = null;
      currentPage++;
      renderPage(currentPage);
    }
  };

  const shuffleBtn = document.getElementById("shuffle");

  shuffleBtn.onclick = () => {
    const data = getFilteredData();
    const start = (currentPage - 1) * pageSize;
    const end = start + pageSize;

    const currentPageData = data.slice(start, end);

    shuffledPageData = shuffleArray(currentPageData);

    renderPage(currentPage);
  };

  unitSelect.onchange = () => {
    shuffledPageData = null;
    currentPage = 1;
    updateTitle();
    renderPage(currentPage);
  };

  // ============ 显示模式切换功能 ============
  // 显示模式切换功能
const modeButtons = document.querySelectorAll('.mode-btn');
let currentDisplayMode = 'all';

function setDisplayMode(mode) {
  currentDisplayMode = mode;
  
  modeButtons.forEach(btn => {
    btn.classList.toggle('active', btn.dataset.mode === mode);
  });
  
  container.classList.remove('mode-only-gana', 'mode-only-explanation');
  if (mode === 'only-gana') {
    container.classList.add('mode-only-gana');
  } else if (mode === 'only-explanation') {
    container.classList.add('mode-only-explanation');
  }
  
  localStorage.setItem('wordTableDisplayMode', mode);
}

modeButtons.forEach(btn => {
  btn.addEventListener('click', () => setDisplayMode(btn.dataset.mode));
});

// 初始化
const savedMode = localStorage.getItem('wordTableDisplayMode') || 'all';
setDisplayMode(savedMode);

  // 初始化选择并渲染
  populateUnitSelect();
  updateTitle();
  renderPage(currentPage);
</script>

</body>
</html>
